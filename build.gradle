plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'org.owasp.dependencycheck' version "${owaspVersion}"
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

group = 'com.company'
version = '0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jacoco {
    toolVersion = '0.8.9'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // spring framework's libs
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${webmvcUiVersion}"
    implementation "net.ttddyy.observation:datasource-micrometer-spring-boot:${datasourceMicrometerVersion}"
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation "commons-io:commons-io:${commonsIoVersion}"
    implementation "org.apache.commons:commons-text:${apacheCommonsTextVersion}"
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackVersion}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Feign dependency for inter-service HTTP calls
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign:${openFeignVersion}"
    implementation "io.github.openfeign:feign-okhttp:${openFeignOkHttpVersion}"

    // db related
    runtimeOnly 'org.postgresql:postgresql'
    implementation "com.clickhouse:clickhouse-jdbc:${clickhouseJdbcVersion}"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    //liquibase
    implementation "org.liquibase:liquibase-core"

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

checkstyle {
    toolVersion = '11.0.1'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

dependencyCheck {
    format = 'ALL'
    outputDirectory = file("${buildDir}/reports/dependency-check/")
    failBuildOnCVSS = 7.0
    autoUpdate = false
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
    }
    data {
        directory = "/opt/owasp/dependency-check/data/"
    }
    analyzers.ossIndex {
        enabled = false
    }
}

configurations.checkstyle {
    exclude group: 'org.apache.commons', module: 'commons-lang3'
}